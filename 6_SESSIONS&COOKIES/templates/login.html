{% include "index.html" %}

{% block title %}
    Login | Interact with this page
{% endblock %}


{% block content %}
    <h1>Login</h1>
    <form methods='post' action="{{ url_for('login') }}" method='POST'>
        <input type="text" id="username" name="username"/>
        <input type="password" id="password" name="password"/>
        <input type="submit" value="Login"/>
    </form>

{% endblock %}
